<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #play-button {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        padding: 12px 24px;
        background-color: #007bff;
        color: white;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 25px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Start-Button erzwingt die Abspiel-Erlaubnis im Browser -->
    <button id="play-button" onclick="startAR()">▶ AR-Experience Starten</button>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <!-- WICHTIG: Ersetze 'dein-video.mp4' mit deinem exakten MP4-Dateinamen -->
        <video id="stopmotion" src="./piepo.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#stopmotion" width="1" height="0.56" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      function startAR() {
        const video = document.getElementById('stopmotion');
        video.play(); // Startet das Video manuell durch Klick
        document.getElementById('play-button').style.display = 'none'; // Versteckt den Button
      }
    </script>
  </body>
</html>
